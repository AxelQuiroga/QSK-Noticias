
name: CI Frontend

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Tests y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar TypeScript y Astro
        run: npm run typecheck

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar tests unitarios
        run: npm test

      - name: Construir sitio
        run: npm run build

      - name: Instalar navegador para Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar tests E2E
        run: npm run test:e2e
