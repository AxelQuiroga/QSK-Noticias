name: Tests del agente editorial

on:
  pull_request:
    paths:
      - ".github/scripts/agente-editorial.py"
      - ".github/scripts/test_agente_editorial.py"
      - "prompts/agente-editorial.md"
      - "src/data/sections.ts"
      - "src/data/locations.ts"
      - "src/lib/international.ts"
      - ".github/workflows/test-agente-editorial.yml"

permissions:
  contents: read

jobs:
  test-editorial-agent:
    name: Tests del código propuesto (sin secretos)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout del código del PR
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar parser YAML
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Ejecutar tests del agente propuesto
        run: python -m unittest discover -s .github/scripts -p 'test_agente_editorial.py' -v
