name: Motor editorial LLM

on:
  push:
    paths:
      - "src/editorial/**"
      - "tests/editorial/**"
      - ".github/workflows/editorial-llm.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  pull_request:
    paths:
      - "src/editorial/**"
      - "tests/editorial/**"
      - ".github/workflows/editorial-llm.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- tests/editorial
